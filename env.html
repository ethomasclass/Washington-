<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>In Washington's Shoes — environments</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #cfe0e6; }
      #view { display: block; width: 100vw; height: 100vh; }
      #title {
        position: fixed; left: 18px; top: 14px; color: #fff;
        font: 600 14px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .1em;
        text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border: 1px solid rgba(255,255,255,.7);
        border-radius: 50%; pointer-events: none;
      }
      #hud {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; pointer-events: none; transition: opacity .3s;
      }
      #hud .card {
        background: rgba(20,26,30,.72); color: #eef2f6;
        border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
        padding: 18px 24px; text-align: center; max-width: 480px;
        font: 14px/1.6 ui-monospace, Menlo, monospace;
      }
      #hud .card b { display: block; font-size: 16px; margin-bottom: 8px; letter-spacing: .04em; }
      /* the container is pointer-transparent so the canvas gets clicks, but the
         scene links must stay clickable or the picker is dead */
      #hud .card a { color: #9fd0ff; text-decoration: none; pointer-events: auto; }
      #hud.hidden { opacity: 0; visibility: hidden; }
      kbd { background: #eef2f6; color: #141a1e; border-radius: 3px; padding: 1px 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="title"></div>
    <div id="crosshair"></div>
    <div id="hud">
      <div class="card">
        <b>WALK THE GROUND</b>
        Click to look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move ·
        <kbd>Shift</kbd> to run · <kbd>Esc</kbd> to release<br /><br />
        <a href="?scene=mount-vernon&weather=clear">Mount Vernon · sun</a> &nbsp;·&nbsp;
        <a href="?scene=mount-vernon&weather=rain">· rain</a> &nbsp;·&nbsp;
        <a href="?scene=valley-forge&weather=snow">Valley Forge · snow</a>
      </div>
    </div>
    <script type="module" src="/src/env/main.ts"></script>
  </body>
</html>
