<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In Washington's Shoes — prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      /*
       * The fault card.
       *
       * If anything stops the game before it can paint, the page is otherwise a
       * blank field of paper — indistinguishable from a bad URL, a stale cache,
       * a failed deploy or a browser that cannot do WebGL. A silent white screen
       * cost this project most of a day, so failure is now visible and names
       * itself. This lives in the page rather than in the bundle deliberately:
       * it has to survive the bundle failing to evaluate at all.
       */
      #fault {
        position: fixed; inset: 0; z-index: 99999; display: flex;
        align-items: center; justify-content: center; padding: 24px;
        background: #241C14;
        font: 16px/1.55 Georgia, "Times New Roman", serif; color: #EFE7D5;
      }
      #fault .card {
        max-width: 640px; background: #EFE7D5; color: #3B2E22;
        border: 1px solid #3B2E22; padding: 22px 26px;
      }
      #fault h1 {
        margin: 0 0 10px; font-size: 21px; font-variant: small-caps;
        letter-spacing: .06em; font-weight: 600;
      }
      #fault p { margin: 0 0 10px; }
      #fault ul { margin: 0 0 10px; padding-left: 20px; }
      #fault li { margin-bottom: 4px; }
      #fault pre {
        margin: 12px 0 0; padding: 10px 12px; overflow-x: auto;
        background: #DCD2BC; border: 1px solid #C3B79B;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #241C14;
        white-space: pre-wrap; word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-hidden="true"></canvas>
      <div id="overlay"></div>
    </div>
    <script>
      (function () {
        var shown = false;
        function show(title, body, detail) {
          if (shown) return;
          shown = true;
          var el = document.createElement('div');
          el.id = 'fault';
          var card = document.createElement('div');
          card.className = 'card';
          var h = document.createElement('h1');
          h.textContent = title;
          var p = document.createElement('p');
          p.textContent = body;
          card.appendChild(h);
          card.appendChild(p);
          if (detail) {
            var pre = document.createElement('pre');
            pre.textContent = detail;
            card.appendChild(pre);
          }
          el.appendChild(card);
          document.body.appendChild(el);
        }

        window.addEventListener('error', function (e) {
          show(
            'The prototype could not start.',
            'Something threw before the first plate was painted. The message below is the whole of what the browser reported.',
            (e.message || 'unknown error') +
              '\n' + (e.filename || '') + (e.lineno ? ':' + e.lineno : '')
          );
        });

        /*
         * Resource failures — a script that 404s, or one the browser refuses on
         * MIME grounds — do NOT reach a normal window error handler. They only
         * surface in the capture phase, which is why the first version of this
         * card reported "no error" for the single most common failure there is.
         */
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || t === window || !(t.src || t.href)) return;
            var url = String(t.src || t.href);
            if (/\.ts(\?|$)/.test(url)) {
              sourceNotBuild(url);
              return;
            }
            show(
              'A file this page needs would not load.',
              'The browser refused or could not find the file below.',
              url
            );
          },
          true
        );

        /*
         * The unambiguous diagnosis.
         *
         * If this page is asking for a .ts file, what is being served is the
         * repository itself rather than the compiled build — no browser can
         * execute TypeScript, so the page will always be blank. That is a
         * hosting setting, not a bug in the game, and it is worth naming
         * precisely instead of leaving anyone to infer it from a white screen.
         */
        function sourceNotBuild(url) {
          show(
            'This site is serving the source, not the build.',
            'The page is asking the browser to run TypeScript, which no browser can execute, ' +
              'so nothing will ever be drawn. This is a hosting setting rather than a fault in ' +
              'the game. In the repository: Settings, then Pages, then set Source to ' +
              '"GitHub Actions" instead of "Deploy from a branch". The workflow has already ' +
              'built and published the compiled game; that setting decides whether it is served.',
            'page:   ' + location.href + '\nasking: ' + url
          );
        }

        document.addEventListener('DOMContentLoaded', function () {
          var raw = document.querySelector('script[src$=".ts"], script[src*=".ts?"]');
          if (raw) sourceNotBuild(raw.getAttribute('src'));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show(
            'The prototype could not start.',
            'Something failed while loading. The message below is the whole of what the browser reported.',
            String((e && e.reason && (e.reason.stack || e.reason.message)) || e.reason)
          );
        });

        // WebGL is not optional here: the whole diorama is drawn with it.
        try {
          var probe = document.createElement('canvas');
          if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) {
            show(
              'This browser cannot open WebGL.',
              'The game draws its scenery with WebGL, and this browser is refusing it. This is usually hardware acceleration being switched off, or a locked-down school profile. Turn on hardware acceleration in the browser settings, or try a different browser, and it will run.'
            );
          }
        } catch (err) { /* the probe itself is allowed to fail quietly */ }

        // Nothing thrown, nothing painted: say so rather than sit blank.
        setTimeout(function () {
          var o = document.getElementById('overlay');
          if (o && o.children.length === 0) {
            show(
              'The prototype did not finish loading.',
              'No error was reported, but nothing has been drawn. That is nearly always a stale cached page or a part-loaded file: reload with a hard refresh (Ctrl+Shift+R, or Cmd+Shift+R on a Mac). If it keeps happening, the single-file build runs with no server at all.'
            );
          }
        }, 9000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
